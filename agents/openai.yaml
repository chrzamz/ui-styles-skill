interface:
  display_name: "UI Styles Designer"
  short_description: "Choose fitting designs for products, slides and forms"
  default_prompt: "Use $ui-styles to infer a fitting visual direction from the requirements and existing project. For requested creation, produce a representative sample in the requested format. If requirements are accepted but creation is not requested, briefly offer the design next step; otherwise stay with requirements clarification. Preserve the chosen style and offer reusable custom profiles when useful."
policy:
  allow_implicit_invocation: true
